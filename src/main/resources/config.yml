# PvP combat tag duration before a logout can be judged.
combat-tag-seconds: 30

# Current implemented behavior is relog. "instant" is reserved and falls back to relog for now.
punishment-mode: relog

# Prompt timeout for clickable YES/NO choices.
prompt-timeout-seconds: 10

# Hide an invisible killer's identity in the public death message while preserving kill credit.
invisible-killer-obfuscation: false

bossbars:
  # Show one decreasing bar for every active combat item cooldown.
  item-cooldowns: false
  # Show the remaining active combat-tag time.
  combat-timer: false

# Combat-only item/action rules: -1 bans, 0 disables the cooldown, positive values are seconds.
combat-item-cooldowns:
  elytra: 0
  fireworks: 0
  ender-pearls: 0
  mace-smash: 0
  riptide: 0
  lunge: 0
  tnt: 0
  tnt-minecarts: 0
  beds: 0
  end-crystals: 0
  respawn-anchors: 0

# Where each item rule applies: "pvp" while combat tagged, or "global" everywhere.
combat-item-scopes:
  elytra: pvp
  fireworks: pvp
  ender-pearls: pvp
  mace-smash: pvp
  riptide: pvp
  lunge: pvp
  tnt: pvp
  tnt-minecarts: pvp
  beds: pvp
  end-crystals: pvp
  respawn-anchors: pvp

# Global multipliers for player health damage. Block damage and knockback are unchanged.
combat-item-damage-modifiers:
  tnt: 1.0
  tnt-minecarts: 1.0
  beds: 1.0
  respawn-anchors: 1.0
  end-crystals: 1.0

# Defaults apply only to players without saved preferences.
pvp:
  default-enabled: false
  toggle-cooldown-seconds: 86400
  # Counted after the final combat tag ends, including offline time.
  post-combat-delay-seconds: 600
  # Prevent players from changing PvP status while in the End dimension.
  prevent-toggle-in-end: false
  # Prevent players from changing PvP status while in the Nether dimension.
  prevent-toggle-in-nether: false
  dragon-egg:
    # Disabled until an administrator enables the privilege.
    enabled: false
    effects:
      glow: true
      strength: true
      speed: true
